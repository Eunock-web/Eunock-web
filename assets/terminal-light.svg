<text x="40" y="252" xml:space="preserve" clip-path="url(#c5)"><tspan fill="#111827">  values</tspan><tspan fill="#374151">: [</tspan><tspan fill="#0b6bd6">"Discipline"</tspan><tspan fill="#374151">, </tspan><tspan fill="#0b6bd6">"Motivation"</tspan><tspan fill="#374151">, </tspan><tspan fill="#0b6bd6">"Continuous learning"</tspan><tspan fill="#374151">],</tspan></text>
<text x="40" y="280" xml:space="preserve" clip-path="url(#c6)"><tspan fill="#111827">  mission</tspan><tspan fill="#374151">: </tspan><tspan fill="#0b6bd6">"Build tech for Benin's digital future"</tspan><tspan fill="#374151">,</tspan></text>
