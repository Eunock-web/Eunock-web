<text x="40" y="224" xml:space="preserve" clip-path="url(#c4)"><tspan fill="#c9d1e0">  focus</tspan><tspan fill="#d4d8e0">: [</tspan><tspan fill="#9fd0ff">"Secure APIs"</tspan><tspan fill="#d4d8e0">, </tspan><tspan fill="#9fd0ff">"Clean code"</tspan><tspan fill="#d4d8e0">, </tspan><tspan fill="#9fd0ff">"Open source"</tspan><tspan fill="#d4d8e0">],</tspan></text>
<text x="40" y="252" xml:space="preserve" clip-path="url(#c5)"><tspan fill="#c9d1e0">  values</tspan><tspan fill="#d4d8e0">: [</tspan><tspan fill="#9fd0ff">"Discipline"</tspan><tspan fill="#d4d8e0">, </tspan><tspan fill="#9fd0ff">"Motivation"</tspan><tspan fill="#d4d8e0">, </tspan><tspan fill="#9fd0ff">"Continuous learning"</tspan><tspan fill="#d4d8e0">],</tspan></text>
<text x="40" y="280" xml:space="preserve" clip-path="url(#c6)"><tspan fill="#c9d1e0">  mission</tspan><tspan fill="#d4d8e0">: </tspan><tspan fill="#9fd0ff">"Build tech for Benin's digital future"</tspan><tspan fill="#d4d8e0">,</tspan></text>
<text x="40" y="308" xml:space="preserve" clip-path="url(#c7)"><tspan fill="#d4d8e0">};</tspan></text>
